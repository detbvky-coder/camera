<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سیستەمی بلۆک - ناسینەوەی دەم و چاو</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#2563eb;--bad:#dc2626;--ok:#16a34a;--bd:#e4e7ec}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--tx:#eef0f4;--mut:#9aa3b2;--bd:#2a2f3a}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:560px;margin-inline:auto}
  h1{font-size:18px;margin:6px 0 12px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
  .tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
  .cam{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:12px;overflow:hidden}
  .cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .row{display:flex;gap:8px;margin-top:10px}
  input[type=text]{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
  button.b{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px}
  button.g{background:var(--bd);color:var(--tx)}
  button.r{background:var(--bad)}
  #status{font-size:13px;color:var(--mut);margin:6px 0}
  #alert{display:none;background:var(--bad);color:#fff;padding:14px;border-radius:12px;font-size:18px;text-align:center;margin-bottom:12px;font-weight:600}
  #okbox{background:var(--ok);color:#fff;padding:10px;border-radius:12px;text-align:center;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
  .item img{width:44px;height:44px;border-radius:50%;object-fit:cover}
  .item span{flex:1}
  .hide{display:none}
  small{color:var(--mut)}
</style>
</head>
<body>
<h1>🛡️ سیستەمی ناسینەوەی کەسە بلۆککراوەکان</h1>
<div id="status">مۆدێلەکان باردەکرێن...</div>

<div class="tabs">
  <button id="t1" class="on">تۆمارکردن</button>
  <button id="t2">چاودێری</button>
</div>

<div id="alert"></div>

<div class="card">
  <div class="cam"><video id="v" autoplay playsinline muted></video><canvas id="c"></canvas></div>
  <div class="row"><button class="b g" id="flip">🔄 گۆڕینی کامێرا</button></div>

  <div id="reg">
    <div class="row">
      <input type="text" id="name" placeholder="ناوی کەسەکە">
      <button class="b" id="add">تۆمارکردن</button>
    </div>
    <div class="row"><small>دەم و چاوی کەسەکە لە کامێرا بخەرە ناو چوارچێوەکە، ڕووناکی باش بێت، پاشان تۆماری بکە.</small></div>
  </div>

  <div id="watch" class="hide">
    <div class="row">
      <button class="b" id="go">▶️ دەستپێکردن</button>
      <button class="b g" id="sound">🔊 دەنگ: چالاک</button>
    </div>
  </div>
</div>

<div class="card">
  <b>لیستی بلۆککراوەکان (<span id="cnt">0</span>)</b>
  <div id="list"></div>
  <small>داتاکان تەنها لەسەر ئەم مۆبایلە هەڵدەگیرێن.</small>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const $=id=>document.getElementById(id);
const video=$("v"),canvas=$("c"),status=$("status");
let facing="user",stream=null,people=[],running=false,timer=null,soundOn=true,lastAlert=0,ready=false;

try{people=JSON.parse(localStorage.getItem("blocked")||"[]")}catch(e){people=[]}
function save(){try{localStorage.setItem("blocked",JSON.stringify(people))}catch(e){status.textContent="⚠️ هەڵگرتن سەرکەوتوو نەبوو"}}

function renderList(){
  $("cnt").textContent=people.length;
  $("list").innerHTML=people.map((p,i)=>`<div class="item"><img src="${p.thumb}"><span>${p.name.replace(/</g,"&lt;")}</span><button class="b r" onclick="del(${i})">سڕینەوە</button></div>`).join("")||"<small>هیچ کەسێک تۆمار نەکراوە</small>";
}
window.del=i=>{people.splice(i,1);save();renderList()};

async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;
  }catch(e){status.textContent="⚠️ کامێرا کارناکات. مۆڵەتی کامێرا بدە و لینکەکە https بێت."}
}
$("flip").onclick=()=>{facing=facing==="user"?"environment":"user";startCam()};

(async()=>{
  try{
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    ready=true;status.textContent="✅ ئامادەیە";
  }catch(e){status.textContent="⚠️ مۆدێلەکان بار نەبوون. ئینتەرنێت بپشکنە."}
  startCam();renderList();
})();

const opts=()=>new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5});

$("add").onclick=async()=>{
  if(!ready)return;
  const name=$("name").value.trim();
  if(!name){status.textContent="ناوێک بنووسە";return}
  status.textContent="دەم و چاو دەخوێنرێتەوە...";
  const d=await faceapi.detectSingleFace(video,opts()).withFaceLandmarks().withFaceDescriptor();
  if(!d){status.textContent="⚠️ هیچ دەم و چاوێک نەدۆزرایەوە، دووبارە هەوڵ بدە";return}
  const t=document.createElement("canvas");t.width=t.height=96;
  const b=d.detection.box;
  t.getContext("2d").drawImage(video,b.x,b.y,b.width,b.height,0,0,96,96);
  people.push({name,desc:Array.from(d.descriptor),thumb:t.toDataURL("image/jpeg",0.7)});
  save();renderList();$("name").value="";status.textContent="✅ "+name+" تۆمارکرا";
};

function beep(){
  if(!soundOn)return;
  try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},400)}catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,100,300]);
}

async function tick(){
  if(!running||video.readyState<2)return;
  const dets=await faceapi.detectAllFaces(video,opts()).withFaceLandmarks().withFaceDescriptors();
  const w=video.videoWidth,h=video.videoHeight;
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");ctx.clearRect(0,0,w,h);
  let hit=null;
  const matcher=people.length?new faceapi.FaceMatcher(people.map(p=>new faceapi.LabeledFaceDescriptors(p.name,[new Float32Array(p.desc)])),0.5):null;
  for(const d of dets){
    const m=matcher?matcher.findBestMatch(d.descriptor):null;
    const bad=m&&m.label!=="unknown";
    const b=d.detection.box;
    ctx.lineWidth=4;ctx.strokeStyle=bad?"#dc2626":"#16a34a";
    ctx.strokeRect(b.x,b.y,b.width,b.height);
    ctx.fillStyle=bad?"#dc2626":"#16a34a";ctx.font="bold 24px sans-serif";
    ctx.fillText(bad?m.label:"ناسراو نییە",b.x,Math.max(24,b.y-8));
    if(bad)hit=m.label;
  }
  const al=$("alert");
  if(hit){al.style.display="block";al.textContent="⛔ ئاگادار! کەسی بلۆککراو: "+hit;
    if(Date.now()-lastAlert>3000){lastAlert=Date.now();beep()}}
  else al.style.display="none";
}

$("go").onclick=()=>{
  if(!ready)return;
  running=!running;
  $("go").textContent=running?"⏹️ وەستاندن":"▶️ دەستپێکردن";
  if(running){timer=setInterval(tick,600)}else{clearInterval(timer);canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);$("alert").style.display="none"}
};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 دەنگ: چالاک":"🔇 دەنگ: کوژاوە";if(soundOn)beep()};

function tab(w){
  $("reg").classList.toggle("hide",w!==1);$("watch").classList.toggle("hide",w!==2);
  $("t1").classList.toggle("on",w===1);$("t2").classList.toggle("on",w===2);
  if(w===1&&running)$("go").click();
}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
</script>
</body>
</html>
